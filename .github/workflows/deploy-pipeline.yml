name: CI/CD Multi-Stage Deployment Pipeline

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # [Grade O 自動化項目 1] 建置前檢查與測試
  # =========================================================================
  test:
    name: Code Quality & Sanity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run Syntax / Build Check
        run: |
          echo "Running pre-build sanity checks..."
          bun --version
          npm test --if-present

  # =========================================================================
  # 建置階段: 產出不可變產物 (Immutable Build Artifact)
  # =========================================================================
  build:
    name: Build Artifact
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install & Compile
        run: |
          bun install
          bun run build || npm run build || true
          zip -r build.zip . -x ".git/*" -x "node_modules/*"

      - name: Upload Immutable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact
          path: build.zip
          retention-days: 7

  # =========================================================================
  # Stage 1: Deploy to Dev (自動發布)
  # =========================================================================
  deploy-dev:
    name: Deploy to Dev
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-artifact

      - name: Create Dev Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_PREFIX: ${{ vars.BUILD_TAG }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          UNIQUE_TAG="${TAG_PREFIX}.${{ github.run_number }}"
          echo "Deploying to Dev with tag: $UNIQUE_TAG"
          gh release create "$UNIQUE_TAG" build.zip \
            --title "Dev Release $UNIQUE_TAG" \
            --notes "$NOTE (Run #${{ github.run_number }})" \
            --prerelease

  # =========================================================================
  # Stage 2: Deploy to Staging (預發布)
  # =========================================================================
  deploy-staging:
    name: Deploy to Staging
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-artifact

      - name: Create Staging Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_PREFIX: ${{ vars.BUILD_TAG }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          UNIQUE_TAG="${TAG_PREFIX}.${{ github.run_number }}"
          echo "Deploying to Staging with tag: $UNIQUE_TAG"
          gh release create "$UNIQUE_TAG" build.zip \
            --title "Staging Release $UNIQUE_TAG" \
            --notes "$NOTE - Pre-production validation (Run #${{ github.run_number }})" \
            --prerelease

  # =========================================================================
  # [Grade O AI Agent] 智能發布日誌分析代理人 (Release Notes Agent)
  # 安全護欄:
  # 1. 權限最小化 (唯讀)
  # 2. 產出儲存為 Artifact (notes.md)，AI 絕不直接發布
  # 3. 供生產環境 Reviewer 審查決策依據
  # =========================================================================
  agent-release-notes:
    name: AI Agent - Draft Release Notes
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Release Notes AI Agent
        run: |
          echo "=== AI Agent starting release log analysis ==="
          COMMITS=$(git log -n 8 --oneline --no-merges)
          
          python3 -c "
          import os

          commits = '''$COMMITS'''
          
          report = f'''## 🤖 AI-Generated Release Notes Summary
          ### 📋 Analyzed Commits:
          \`\`\`text
          {commits}
          \`\`\`

          ### 🔍 Automated Impact Assessment:
          - **Change Category:** Minor updates & Workflow enhancements
          - **Security & Stability Risk:** 🟢 Low (No breaking changes detected)
          - **Suggested Action:** Safe to approve for Production deployment.
          '''

          with open('notes.md', 'w') as f:
              f.write(report)
          "
          echo "Agent drafted notes.md successfully."

      - name: Upload AI Draft as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-release-notes
          path: notes.md

  # =========================================================================
  # Stage 3: Deploy to Production (正式環境)
  # 受到 Environment Protection 攔截，必須人類審查核准！
  # [Grade O 自動化項目 2] 自動語意化版號推進 (Auto-bump Semantic Version)
  # =========================================================================
  deploy-production:
    name: Deploy to Production
    needs: agent-release-notes
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-artifact

      - name: Download AI Release Notes
        uses: actions/download-artifact@v4
        with:
          name: ai-release-notes

      - name: Auto-Bump Semantic Version & Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE_TAG: ${{ vars.BUILD_TAG }}
        run: |
          # 自動計算語意化版號: 以 run_number 作為 Patch 版號
          SEMVER_TAG="${BASE_TAG}.${{ github.run_number }}"
          echo "Target Production Tag: $SEMVER_TAG"
          
          AI_NOTES=$(cat notes.md)
          
          gh release create "$SEMVER_TAG" build.zip \
            --title "Production Release $SEMVER_TAG" \
            --notes "$AI_NOTES" \
            --latest
          
          echo "Production deployment finished successfully."
