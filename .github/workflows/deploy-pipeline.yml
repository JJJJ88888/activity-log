name: Build-Test-Release-Pipeline

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: '是否模擬測試失敗 (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write

jobs:
  # ========================================================
  # 1. BUILD JOB
  # ========================================================
  build:
    name: 🔨 Build Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install || true

      - name: Build Software
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/

  # ========================================================
  # 2. UNIT TEST JOB (矩陣測試 + 覆蓋率門禁 - Grade O)
  # ========================================================
  test-unit:
    name: 🧪 Unit Tests (Node ${{ matrix.node-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x] # Grade O: 跨版本矩陣測試
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Unit Tests & Coverage Check
        env:
          FAIL_TEST: ${{ github.event.inputs.simulate_failure }}
        run: npm run test:unit

      - name: Generate Coverage Report
        if: matrix.node-version == '20.x'
        run: |
          mkdir -p coverage
          echo "Coverage Report generated on Node 20.x at $(date)" > coverage/summary.txt

      - name: Upload Coverage Artifact (Grade O)
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # ========================================================
  # 3. INTEGRATION TEST JOB (參數化環境 - Grade E)
  # ========================================================
  test-integration:
    name: 🔗 Integration Tests
    needs: test-unit
    runs-on: ubuntu-latest
    env:
      TEST_ENV: staging # Grade E: 參數化環境變數
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist/

      - name: Run Integration Tests
        run: npm run test:integration

  # ========================================================
  # 4. 測試失敗自動開 ISSUE (Grade O 亮點通知)
  # ========================================================
  handle-failure:
    name: 🚨 Report Failure
    needs: [test-unit, test-integration]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Auto-Create GitHub Issue on Failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue create \
            --title "❌ CI Pipeline 測試失敗通知 (Run ID: ${{ github.run_id }})" \
            --body "自動化測試未通過，已自動阻擋後續 Staging/Production 發布流程。請檢視日誌：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ========================================================
  # 5. DEPLOY TO STAGING (Grade E)
  # ========================================================
  deploy-staging:
    name: 🚀 Deploy to Staging
    needs: test-integration
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist/

      - name: Release to Staging
        run: |
          TAG_NAME="staging-$(date +%s)"
          gh release create "$TAG_NAME" dist/* --title "Staging Release $TAG_NAME" --notes "自動化測試皆已通過，自動發布至測試環境。"

  # ========================================================
  # 6. DEPLOY TO PRODUCTION (Grade E/O: 人工審核門禁)
  # ========================================================
  deploy-production:
    name: 🌐 Deploy to Production (Manual Approval)
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production # 觸發人工審核 (Required Reviewers)
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist/

      - name: Release to Production
        run: |
          TAG_NAME="prod-$(date +%s)"
          gh release create "$TAG_NAME" dist/* --title "Production Release $TAG_NAME" --notes "通過所有測試並經管理員人工審查核准之正式發布版本。"
